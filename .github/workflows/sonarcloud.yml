name: SonarCloud Scan (Altroj)

on:
  push:
    branches:
      - Altoroj-3.2
  pull_request:
    branches:
      - Altoroj-3.2
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Setup Java
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # ✅ Install SonarScanner
      - name: Install SonarScanner
        run: |
          curl -sSLo scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q scanner.zip
          echo "SCANNER_HOME=$(find . -type d -name 'sonar-scanner-*' | head -n 1)" >> $GITHUB_ENV
          echo "$(find . -type d -name 'sonar-scanner-*' | head -n 1)/bin" >> $GITHUB_PATH

      # ✅ Try build (best effort)
      - name: Build project
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean install -DskipTests || echo "Maven build failed"
          elif [ -f "build.gradle" ]; then
            ./gradlew build || gradle build || echo "Gradle build failed"
          else
            echo "No build tool detected"
          fi

      # ✅ Detect compiled classes
      - name: Detect binaries
        id: binaries
        run: |
          BIN=$(find . -type d \( -path "*/target/classes*" -o -path "*/build/classes*" \) | head -n 1)
          if [ -z "$BIN" ]; then
            echo "No binaries found, using fallback"
            BIN="."
          fi
          echo "bin=$BIN" >> $GITHUB_OUTPUT

      # ✅ Run SonarCloud
      - name: Run SonarCloud Scan
        run: |
          $SCANNER_HOME/bin/sonar-scanner \
            -Dsonar.projectKey=Sambit-rgb_Java-AltoroJ \
            -Dsonar.organization=sambit-rgb \
            -Dsonar.sources=. \
            -Dsonar.java.binaries=${{ steps.binaries.outputs.bin }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
